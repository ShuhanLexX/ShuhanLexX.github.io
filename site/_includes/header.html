<header class="site-header">
  <nav class="site-navigation" aria-label="{{ t.nav_label }}">
    <a class="site-wordmark" href="{{ locale_prefix | append: '/' | relative_url }}"
      ><img src="{{ '/favicon.svg' | relative_url }}" width="25" height="25" alt="" />{{ t.name }}</a
    >
    <div class="primary-nav" id="primaryNav">
      <a aria-current="{% if page.page_kind == 'home' %}page{% else %}false{% endif %}" href="{{ locale_prefix | append: '/' | relative_url }}"
        >{{ t.nav_home }}</a
      >
      <a
        aria-current="{% if page.page_kind == 'research' %}page{% else %}false{% endif %}"
        href="{{ locale_prefix | append: '/research/' | relative_url }}"
        >{{ t.nav_research }}</a
      >
      <a
        aria-current="{% if page.page_kind == 'publications' %}page{% else %}false{% endif %}"
        href="{{ locale_prefix | append: '/publications/' | relative_url }}"
        >{{ t.nav_publications }}</a
      >
      <a aria-current="{% if page.page_kind == 'cv' %}page{% else %}false{% endif %}" href="{{ locale_prefix | append: '/cv/' | relative_url }}"
        >{{ t.nav_cv }}</a
      >
    </div>
    <div class="navigation-controls">
      <a
        class="language-switch"
        href="{{ page.alternate_url | default: '/zh/' | relative_url }}"
        lang="{% if lang == 'zh' %}en{% else %}zh-CN{% endif %}"
        hreflang="{% if lang == 'zh' %}en{% else %}zh-CN{% endif %}"
        aria-label="{{ t.language_label }}"
        >{{ t.language }}</a
      >
      <button
        class="theme-control"
        type="button"
        id="darkModeToggle"
        aria-label="{{ t.theme_label }}"
        data-light-label="{{ t.theme_light }}"
        data-dark-label="{{ t.theme_dark }}"
      >
        <span id="themeIcon" aria-hidden="true">◐</span>
      </button>
      <button class="site-menu-button" type="button" id="menuToggle" aria-controls="primaryNav" aria-expanded="false" aria-label="{{ t.menu }}">
        <span aria-hidden="true">☰</span>
      </button>
    </div>
  </nav>
</header>
