<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | escape }} · {{ t.name | escape }}</title>
  <meta name="description" content="{{ t.description | escape }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  {% if page.alternate_url %}
  <link rel="alternate" hreflang="{% if lang == 'zh' %}zh-CN{% else %}en{% endif %}" href="{{ page.url | absolute_url }}" />
  <link rel="alternate" hreflang="{% if lang == 'zh' %}en{% else %}zh-CN{% endif %}" href="{{ page.alternate_url | absolute_url }}" />
  <link
    rel="alternate"
    hreflang="x-default"
    href="{% if lang == 'zh' %}{{ page.alternate_url | absolute_url }}{% else %}{{ page.url | absolute_url }}{% endif %}"
  />
  {% endif %}
  <meta property="og:title" content="{{ t.name | escape }} · {{ page.title | escape }}" />
  <meta property="og:description" content="{{ t.description | escape }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:locale" content="{% if lang == 'zh' %}zh_CN{% else %}en_US{% endif %}" />
  <meta property="og:image" content="{{ '/images/gplab-framework-original.png' | absolute_url }}" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ t.name | escape }}" />
  <meta name="twitter:description" content="{{ t.description | escape }}" />
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  <script>
    (function () {
      var theme = "light";
      try {
        if (localStorage.getItem("shuhan-theme") === "dark") theme = "dark";
      } catch (error) {}
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
  {% if jekyll.environment == 'production' %}{% include analytics.html %}{% endif %}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "name": {{ t.name | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "inLanguage": "{% if lang == 'zh' %}zh-CN{% else %}en{% endif %}",
      "mainEntity": {
        "@type": "Person",
        "name": "Shuhan Zhang",
        "alternateName": "张书含",
        "url": {{ '/' | absolute_url | jsonify }},
        "sameAs": ["https://github.com/ShuhanLexX"],
        "alumniOf": {"@type": "CollegeOrUniversity", "name": "Zhengzhou University"},
        "knowsAbout": ["Legislative studies", "LLM-based social simulation", "Policy evaluation"]
      }
    }
  </script>
</head>
