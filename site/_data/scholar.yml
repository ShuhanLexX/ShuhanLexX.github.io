  research_question: 如何在立法与政策实施前，更好地评估其可能产生的社会效果？
  themes:
    - title: 立法学
      text: 关注立法的宪法基础、制度设计，以及法律规则影响社会运行与公共治理的制度机制。
    - title: 大模型社会模拟
      text: 构建生成式社会代理与相互关联的社会子系统，研究异质性行为与复杂社会动态。
    - title: 立法与政策评估
      text: 将可复现的政策实验与真实数据、统计验证相结合，支持情景比较与政策方案优化。
