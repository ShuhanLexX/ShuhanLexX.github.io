  capabilities_text: 我擅长基于数据的实证分析，具备一定编程基础，关注大模型技术在社会科学研究中的应用。跨学科科研实践、平台研发与团队协作经验，为持续产出高质量成果及重大科研项目申请提供了扎实基础。
