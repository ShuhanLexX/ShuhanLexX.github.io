zh:
  name: 张书含
  secondary_name: Shuhan Zhang
  role: 法学与计算社会科学研究者
  institution: 郑州大学法学院
  description: 张书含的学术主页，研究方向为立法学、大模型社会模拟、立法与政策评估。代表作包括 GPLab、生成式代理模型驱动的政策效果评估及 Auto-ABM。
  kicker: 法学 · 社会模拟 · 生成式人工智能
  lead: 让立法与政策的效果可观察、可比较、可解释。
  intro: 我的研究聚焦于生成式代理模型驱动的社会仿真在立法与政策效果评估中的应用，将立法学、宪法与行政法学研究与大语言模型、社会模拟相结合。我已构建具有可复现性与通用性的政策模拟与评估平台，支持复杂立法与政策情景的效果评估、对比实验与方案优化。
  availability: 寻求高校及科研岗位机会
